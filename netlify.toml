[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[build.environment]
NODE_VERSION = "20"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

# Backend — these are public anon-key values safe to embed in the client bundle.
# Points at the live backend that holds the products, accounts and orders —
# the same project the app falls back to in development.
